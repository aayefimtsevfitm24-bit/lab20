<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>TODO App — Firebase</title>
</head>

<body>
  <div class="container">
    <h1 class="mt-5">My TODO App</h1>
    <div class="mb-3">
      <span class="me-3">Item count: <span id="item-count">0</span></span>
      <span>Unchecked count: <span id="unchecked-count">0</span></span>
    </div>

    <button class="btn btn-primary mb-3" id="add-btn" onclick="newTodo()">New TODO</button>

    <!-- Умовний рендеринг: індикатор завантаження -->
    <div id="loading" class="d-none align-items-center mb-3 text-primary">
      <div class="spinner-border spinner-border-sm me-2" role="status"></div>
      <span>Завантаження даних з БД...</span>
    </div>

    <!-- Умовний рендеринг: повідомлення про помилку -->
    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

    <ul id="todo-list" class="list-group"></ul>
  </div>

  <script src="script.js"></script>
</body>

</html>
